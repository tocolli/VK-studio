<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mesa — VK.Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/mesa.css"/>
  <link rel="stylesheet" href="css/ficha-cavaleiros.css"/>
</head>
<body class="mesa-body">

<!-- ===== TOPBAR ===== -->
<header class="mesa-topbar">
  <div class="topbar-left">
    <span class="topbar-logo">VK.Studio</span>
    <div class="topbar-divider"></div>
    <span class="topbar-sessao-nome" id="topbarNomeSessao">—</span>
    <span class="topbar-sessao-codigo" id="topbarCodigo"></span>
  </div>

  <div class="topbar-center" id="topbarTools">
    <!-- Ferramentas mestre -->
    <div class="tool-group" id="grupoMestre" style="display:none;">
      <button class="tool-btn active" data-tool="select"    data-tip="Selecionar (S)"><i data-lucide="mouse-pointer-2"></i></button>
      <button class="tool-btn"        data-tool="fog-erase" data-tip="Revelar Fog (R)"><i data-lucide="eye"></i></button>
      <button class="tool-btn"        data-tool="fog-paint" data-tip="Cobrir Fog (C)"><i data-lucide="eye-off"></i></button>
      <button class="tool-btn"        data-tool="measure"   data-tip="Medir distância (D)"><i data-lucide="ruler"></i></button>
      <button class="tool-btn"        data-tool="ping"      data-tip="Marcar ponto (P)"><i data-lucide="map-pin"></i></button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="btnAddToken" data-tip="Adicionar token"><i data-lucide="plus-circle"></i></button>
      <button class="tool-btn" id="btnMapas"    data-tip="Gerenciar mapas"><i data-lucide="map"></i></button>
    </div>
    <!-- Ferramentas jogador -->
    <div class="tool-group" id="grupoJogador">
      <button class="tool-btn active" data-tool="select" data-tip="Selecionar"><i data-lucide="mouse-pointer-2"></i></button>
      <button class="tool-btn"        data-tool="measure" data-tip="Medir"><i data-lucide="ruler"></i></button>
    </div>
  </div>

  <div class="topbar-right">
    <div class="usuarios-pips" id="usuariosPips"></div>
    <div class="topbar-divider"></div>
    <button class="topbar-icon-btn" id="btnFichas" data-tip="Fichas (F)"><i data-lucide="scroll-text"></i></button>
    <button class="topbar-icon-btn" id="btnChat"   data-tip="Chat (T)">
      <i data-lucide="message-square"></i>
      <span class="notif-badge" id="chatBadge" style="display:none;"></span>
    </button>
    <div class="topbar-divider"></div>
    <button class="topbar-icon-btn danger" id="btnSair" data-tip="Sair"><i data-lucide="log-out"></i></button>
  </div>
</header>

<!-- ===== VIEWPORT ===== -->
<div class="mesa-viewport" id="mesaViewport">
  <canvas id="mesaCanvas"></canvas>
  <div class="ping-ring" id="pingRing" style="display:none;"></div>

  <!-- Régua de medição -->
  <div class="measure-label" id="measureLabel" style="display:none;"></div>

  <!-- Controles de zoom (canto inferior esquerdo) -->
  <div class="zoom-bar">
    <button class="zoom-btn" id="btnZoomOut"><i data-lucide="minus"></i></button>
    <span class="zoom-pct" id="zoomPct">100%</span>
    <button class="zoom-btn" id="btnZoomIn"><i data-lucide="plus"></i></button>
    <button class="zoom-btn" id="btnZoomFit" data-tip="Ajustar ao mapa"><i data-lucide="maximize-2"></i></button>
  </div>
</div>

<!-- ===== SIDEBAR DIREITA ===== -->
<aside class="mesa-sidebar" id="mesaSidebar">

  <!-- Abas da sidebar -->
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" data-stab="fichas">
      <i data-lucide="scroll-text"></i><span>Fichas</span>
    </button>
    <button class="sidebar-tab" data-stab="chat">
      <i data-lucide="message-square"></i><span>Chat</span>
      <span class="notif-badge-tab" id="chatBadgeTab" style="display:none;"></span>
    </button>
    <button class="sidebar-tab" id="tabConfigs" data-stab="config" style="display:none;">
      <i data-lucide="settings"></i><span>Config</span>
    </button>
  </div>

  <!-- ABA: FICHAS -->
  <div class="sidebar-content" id="stabFichas">
    <div class="sidebar-section-label">Minhas Fichas</div>
    <div id="listaFichasSidebar" class="fichas-sidebar-lista">
      <div class="sidebar-empty">
        <i data-lucide="scroll-text"></i>
        <p>Nenhuma ficha encontrada</p>
        <a href="/forja" target="_blank" class="sidebar-link">Criar na Forja</a>
      </div>
    </div>
    <!-- Fichas de outros jogadores (só mestre) -->
    <div id="secaoFichasJogadores" style="display:none;">
      <div class="sidebar-section-label" style="margin-top:.75rem;">Fichas dos Jogadores</div>
      <div id="listaFichasJogadores" class="fichas-sidebar-lista"></div>
    </div>
  </div>

  <!-- ABA: CHAT -->
  <div class="sidebar-content" id="stabChat" style="display:none;">
    <div class="chat-msgs-area" id="chatMsgs"></div>
    <div class="chat-dados-row">
      <button class="dado-chip" data-expr="1d4">d4</button>
      <button class="dado-chip" data-expr="1d6">d6</button>
      <button class="dado-chip" data-expr="1d8">d8</button>
      <button class="dado-chip" data-expr="1d10">d10</button>
      <button class="dado-chip" data-expr="1d12">d12</button>
      <button class="dado-chip" data-expr="1d20">d20</button>
      <button class="dado-chip" data-expr="1d100">d%</button>
    </div>
    <div class="chat-input-wrap">
      <input type="text" id="chatInput" class="chat-input"
             placeholder="Mensagem ou 2d6+3..."/>
      <button class="chat-send-btn" id="btnChatSend">
        <i data-lucide="send"></i>
      </button>
    </div>
    <div class="chat-private-row" id="chatPrivateRow" style="display:none;">
      <label class="private-label">
        <input type="checkbox" id="checkPrivado"/>
        <i data-lucide="lock"></i>
        <span>Rolagem privada</span>
      </label>
    </div>
  </div>

  <!-- ABA: CONFIG (mestre) -->
  <div class="sidebar-content" id="stabConfig" style="display:none;">
    <div class="sidebar-section-label">Sessão</div>
    <div class="config-info" id="configSessaoInfo"></div>
    <button class="config-btn danger" id="btnEncerrarSessao">
      <i data-lucide="x-circle"></i> Encerrar Sessão
    </button>
  </div>
</aside>

<!-- ===== JANELAS ARRASTÁVEIS ===== -->
<!-- Container de janelas (fichas abertas) -->
<div id="windowsContainer"></div>

<!-- ===== TOOLTIP GLOBAL ===== -->
<div class="token-ctx-menu" id="tokenCtxMenu" style="display:none;"></div>

<!-- ===== MODAL: ENTRAR NA MESA ===== -->
<div class="overlay open" id="overlayEntrar">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Entrar na Mesa</span>
    </div>
    <div id="alertEntrar" class="modal-alert" style="display:none;"></div>

    <div class="modal-field">
      <label>Código da Sessão</label>
      <input type="text" id="inputCodigo" class="modal-inp" maxlength="8"
             placeholder="Ex: A1B2C3D4"
             style="text-transform:uppercase;letter-spacing:.25em;font-size:1.1rem;text-align:center;"/>
    </div>
    <div class="modal-actions">
      <a href="/dashboard" class="modal-btn ghost">
        <i data-lucide="arrow-left"></i> Voltar
      </a>
      <button class="modal-btn primary" id="btnEntrar">Entrar</button>
    </div>

    <div class="modal-ou" id="ouMestre" style="display:none;">ou</div>
    <div id="criarSessaoWrap" style="display:none;">
      <div class="modal-field">
        <label>Nome da Nova Sessão</label>
        <input type="text" id="inputNomeSessao" class="modal-inp"
               placeholder="Ex: Sessão 3 — As Ruínas de Korth"/>
      </div>
      
      <!-- Filtro de Sistema -->
      <div class="modal-field">
        <label>Sistema de RPG</label>
        <select id="selectSistemaSessao" class="modal-inp" style="cursor: pointer; appearance: auto;">
          <option value="Decadência Cinza">Decadência Cinza</option>
          <option value="Oceano Estrelado">Oceano Estrelado</option>
          <option value="Cavaleiros de Armadura">Cavaleiros de Armadura</option>
        </select>
        <div style="text-align: right; margin-top: 8px;">
          <a href="/integracao" style="color: var(--gold-dim); font-size: 0.75rem; text-decoration: underline; font-family: 'Crimson Text', serif;">Solicite a integração do seu sistema</a>
        </div>
      </div>

      <!-- V4: Narrador -->
      <div style="margin-top: 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="checkNarradorSessao" style="width:16px; height:16px; accent-color: var(--gold-dim);">
        <label for="checkNarradorSessao" style="font-size: 0.85rem; color: #ccc; cursor: pointer;">Assumir papel de Narrador (Mestre da Mesa)</label>
      </div>

      <button class="modal-btn primary" id="btnCriarSessao" style="width:100%;">
        <i data-lucide="plus"></i> Criar Sessão
      </button>
    </div>
  </div>
</div>

<!-- ===== MODAL: MAPAS ===== -->
<div class="overlay" id="overlayMapas">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-header">
      <span class="modal-title">Mapas da Sessão</span>
      <button class="modal-close" data-close="overlayMapas"><i data-lucide="x"></i></button>
    </div>
    <div id="mapaLista" class="mapa-lista"></div>
    <div class="modal-section-label" style="margin-top:1rem;">Enviar Novo Mapa</div>
    <div class="modal-field">
      <label>Nome</label>
      <input type="text" id="mapaNovoNome" class="modal-inp" placeholder="Ex: Cidade de Stormport"/>
    </div>
    <div class="modal-field">
      <label>Imagem (JPG/PNG/WebP · max 15MB)</label>
      <input type="file" id="mapaNovoArq" accept="image/*" class="modal-inp"/>
    </div>
    <div class="modal-grid2">
      <div class="modal-field">
        <label>Colunas</label>
        <input type="number" id="mapaNovoCol" value="20" min="5" max="80" class="modal-inp"/>
      </div>
      <div class="modal-field">
        <label>Linhas</label>
        <input type="number" id="mapaNovoRow" value="20" min="5" max="80" class="modal-inp"/>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn primary" id="btnEnviarMapa" style="width:100%;">
        <i data-lucide="upload"></i> Enviar Mapa
      </button>
    </div>
  </div>
</div>

<!-- ===== MODAL: TOKEN ===== -->
<div class="overlay" id="overlayToken">
  <div class="modal-box" style="max-width:480px;">
    <div class="modal-header">
      <span class="modal-title" id="tokenModalTitulo">Novo Token</span>
      <button class="modal-close" data-close="overlayToken"><i data-lucide="x"></i></button>
    </div>

    <div class="modal-field">
      <label>Nome</label>
      <input type="text" id="tokenNome" class="modal-inp" placeholder="Ex: Kael, Goblin A..."/>
    </div>

    <!-- GALERIA DE IMAGENS -->
    <div class="modal-field">
      <label>Imagem</label>
      <div class="galeria-tabs">
        <button class="galeria-tab active" data-gtab="fichas">Fichas</button>
        <button class="galeria-tab" data-gtab="jogadores">Jogadores</button>
        <button class="galeria-tab" data-gtab="url">URL</button>
      </div>
      <div id="galeriaFichas"    class="galeria-grid"></div>
      <div id="galeriaJogadores" class="galeria-grid" style="display:none;"></div>
      <div id="galeriaUrl"       style="display:none;">
        <input type="text" id="tokenUrlInput" class="modal-inp" placeholder="https://..."/>
      </div>
      <div class="galeria-preview" id="galeriaPreview" style="display:none;">
        <img id="galeriaPreviewImg" alt="preview"/>
        <button class="galeria-clear" id="btnGaleriaClear">
          <i data-lucide="x"></i> Remover
        </button>
      </div>
    </div>

    <div class="modal-grid2">
      <div class="modal-field">
        <label>HP Atual</label>
        <input type="number" id="tokenHpAtual" value="10" min="0" class="modal-inp"/>
      </div>
      <div class="modal-field">
        <label>HP Máximo</label>
        <input type="number" id="tokenHpMax" value="10" min="1" class="modal-inp"/>
      </div>
    </div>
    <div class="modal-grid2">
      <div class="modal-field">
        <label>Tamanho (células)</label>
        <input type="number" id="tokenTam" value="1" min="1" max="5" class="modal-inp"/>
      </div>
      <div class="modal-field">
        <label>Cor</label>
        <input type="color" id="tokenCor" value="#c9a84c"
               class="modal-inp" style="height:38px;cursor:pointer;padding:.25rem;"/>
      </div>
    </div>

    <!-- ILUMINAÇÃO -->
    <div class="modal-section-label" style="margin-top:.5rem;">Iluminação</div>
    <div class="modal-grid2">
      <div class="modal-field">
        <label>
          <input type="checkbox" id="tokenLuzAtiva" style="accent-color:var(--gold);margin-right:.4rem;"/>
          Luz ativa
        </label>
      </div>
      <div class="modal-field">
        <label>Raio (células)</label>
        <input type="number" id="tokenLuzRaio" value="3" min="1" max="20" class="modal-inp"/>
      </div>
    </div>
    
    <div class="modal-actions">
      <button class="modal-btn ghost"   id="btnTokenCancel">Cancelar</button>
      <button class="modal-btn danger"  id="btnTokenDelete" style="display:none;">Remover</button>
      <button class="modal-btn primary" id="btnTokenSave">Salvar</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/ficha-cavaleiros.js"></script>
<script src="js/mesa.js"></script>
<script>lucide.createIcons();</script>

<!-- MODAL CATÁLOGO DO SISTEMA (MESTRE) -->
<div class="modal-overlay" id="overlayCatalogoLoja" style="display:none; z-index:9999;">
  <div class="modal-content" style="max-width: 600px; width:90%; max-height:80vh; display:flex; flex-direction:column; background:#111214; border:1px solid #3a3d44;">
    <div class="modal-header" style="border-bottom:1px solid #333; padding:15px; display:flex; justify-content:space-between; align-items:center;">
      <h3 style="color:var(--gold); margin:0; font-family:'Cinzel', serif;">Catálogo do Sistema</h3>
      <button class="modal-close" onclick="fecharOverlay('overlayCatalogoLoja')" style="background:transparent; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    
    <div style="padding:15px; border-bottom:1px solid #333;">
      <input type="text" id="inputBuscaCatalogo" placeholder="Buscar item, arma, armadura..." class="modal-inp" style="width:100%;" oninput="filtrarCatalogoLoja()">
    </div>

    <div id="listaCatalogoSistema" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px;">
      <!-- Itens do BD aparecem aqui -->
      <div style="text-align:center; color:#888;">Carregando itens do banco de dados...</div>
    </div>
  </div>
</div>

</body>
</html>
